<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://michaelmallo.github.io/rule-index/" />
    <meta
      name="description"
      content="RuleIndex — Hourly distilled leaderboard of AI coding agent rules across AGENTS.md, CLAUDE.md, .cursorrules, Copilot, Windsurf, Cline, and Gemini CLI."
    />

    <!-- Open Graph / Social Media Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RuleIndex" />
    <meta property="og:title" content="RuleIndex — AI Coding Agent Rules Leaderboard" />
    <meta
      property="og:description"
      content="Explore the top AI coding agent rules distilled hourly from public GitHub repositories across AGENTS.md, CLAUDE.md, .cursorrules, Copilot, Windsurf, Cline, and Gemini CLI."
    />
    <meta property="og:url" content="https://michaelmallo.github.io/rule-index/" />
    <meta property="og:image" content="https://michaelmallo.github.io/rule-index/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RuleIndex — Ranked leaderboard of AI coding agent rules across AGENTS.md, CLAUDE.md, .cursorrules, Copilot, Windsurf, Cline, and Gemini CLI"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RuleIndex — AI Coding Agent Rules Leaderboard" />
    <meta
      name="twitter:description"
      content="Explore the top AI coding agent rules distilled hourly from public GitHub repositories across AGENTS.md, CLAUDE.md, .cursorrules, Copilot, Windsurf, Cline, and Gemini CLI."
    />
    <meta name="twitter:image" content="https://michaelmallo.github.io/rule-index/og-preview.png" />
    <meta
      name="twitter:image:alt"
      content="RuleIndex — Ranked leaderboard of AI coding agent rules across AGENTS.md, CLAUDE.md, .cursorrules, Copilot, Windsurf, Cline, and Gemini CLI"
    />

    <title>RuleIndex — AI Coding Agent Rules Leaderboard</title>
    <script>
      // Synchronous FOUC-prevention script before first paint
      try {
        var saved = localStorage.getItem('ruleindex:theme') || 'light';
        var valid = ['light', 'dark', 'solarized', 'terminal'];
        var theme = valid.indexOf(saved) !== -1 ? saved : 'light';
        document.documentElement.dataset.theme = theme;
        var scheme = theme === 'dark' || theme === 'terminal' ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', scheme);
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
